<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Branding Project Enquiry</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        padding: 20px;
        margin:0;
        padding:25px;
    }
    .form-container {
      width:100vw;
        height:100vh;
        background-color:light-blue;

        display:flex;
        justify-content:center;
        align-items:center;
    }
     form{
         width:90%;
     }
    h2 {
        text-align: center;
        color: #222;
        margin-bottom: 10px;
    }
    p {
        text-align: center;
        color: #666;
        font-size: 14px;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }
    input, textarea, select {
        width: 80%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 14px;
    }
    textarea {
        resize: vertical;
        min-height: 100px;
    }
    @media(max-width:600px){
        .formbox{
            padding:15px
        }
    }
    button {
        margin-top: 20px;
        width: 100%;
        background: #000;
        color: #fff;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #556791;
    }
</style>
</head>

<body>

<div class="form-container">
    <h2>TRUST US AND OUR BRAND TO ENLIGHTEN YOURS</h2>
    <p>Kindly fill in your details and specify your needs</p>

  
        
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="full name" required>

        <label for="business">Business / Brand Name</label>
        <input type="text" id="business" name="business" placeholder="company name">

       

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+267 71234567">

       
       
        <label for="message">A step in follow up</label>
        <textarea id="message" name="message" placeholder="Tell us about your experience with Elite Printworks"></textarea>

        <button type="submit">Submit Order</button>
    </form>
</div>

</body>
</html>
