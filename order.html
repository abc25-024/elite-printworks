<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Branding & Signage</title>
 
</head>
<body>
  <div class="container">
    <h1>Place Your Order</h1>
    <form id="orderForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="company">Company Name</label>
      <input type="text" id="company" name="company">

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">

      <label for="product">Select Product</label>
      <select id="product" name="product" required>
        <option value="">-- Choose an option --</option>
        <option value="signage">Signage</option>
        <option value="banner">Banner</option>
        <option value="vehicle_wrap">Vehicle Wrap</option>
        <option value="merchandise">Branded Merchandise</option>
      </select>

      <label for="size">Size / Dimensions</label>
      <input type="text" id="size" name="size" placeholder="e.g. 2m x 1m">

      <label for="material">Material</label>
      <input type="text" id="material" name="material" placeholder="e.g. Vinyl, Acrylic">

      <label for="file">Upload Logo / Artwork</label>
      <input type="file" id="file" name="file">

      <label for="instructions">Special Instructions(if any)</label>
      <textarea id="instructions" name="instructions" rows="4"></textarea>

      <button type="submit">Submit Order</button>
    </form>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Thank you! Your order has been submitted. We will contact you shortly.');
      // Here you would normally send the form data to your server
    });
  </script>
</body>
</html>
